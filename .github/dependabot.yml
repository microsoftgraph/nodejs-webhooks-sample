version: 2
updates:
- package-ecosystem: npm
  directory: /
  groups:
    npm-dependencies:
      patterns: ["*"]
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: /
  groups:
    github-actions:
      patterns: ["*"]
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
